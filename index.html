<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VERY LABEL 인플루언서 영입보드</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VL 영입보드">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&display=swap">
<style>
:root{
  --blue:#293BAC; --blue-d:#1D2C8A; --hero:#0E46A3; --yellow:#FFE600; --ink:#111; --sub:#5B6170; --line:#E6E8EE; --bg:#F6F7FA; --card:#fff;
  --m1:#293BAC; --m2:#0F9D8A; --m3:#E2702A;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.serif{font-family:"Playfair Display",Georgia,serif}
.hidden{display:none!important}

/* top & header */
.topbar{background:var(--yellow);text-align:center;font-weight:600;font-size:13.5px;padding:7px 12px}
.hd{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.hd-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 20px 10px}
.logo{height:26px;width:auto;display:block}
.hd-sub{font-family:"Playfair Display",Georgia,serif;font-weight:800;color:var(--blue);font-size:15px;letter-spacing:.06em;margin-top:3px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{font-size:12.5px;color:var(--sub);white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:5px;vertical-align:1px}
.sync.err i{background:#ef4444}
.me-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:7px;font-weight:700}
.av{width:26px;height:26px;border-radius:50%;color:#fff;font-size:10.5px;letter-spacing:-.03em;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tabs{max-width:1240px;margin:0 auto;display:flex;gap:8px;padding:4px 20px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;color:#333}
.tab .n{font-size:12.5px;background:#EEF0F6;color:var(--sub);border-radius:999px;padding:1px 8px;font-weight:700}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.on .n{background:rgba(255,255,255,.2);color:#fff}
.tab .dot{width:9px;height:9px;border-radius:50%}

/* hero */
.hero{background:var(--hero);background:linear-gradient(120deg,#0B3E96 0%,#1450B8 60%,#1E5CC8 100%);color:#fff}
.hero-in{max-width:1240px;margin:0 auto;padding:22px 20px 24px;display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center}
.hero h1{margin:0;font-size:26px;line-height:1.3;font-weight:800;letter-spacing:-.02em}
.hero p{margin:6px 0 0;opacity:.85;font-size:14.5px}
.kpis{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:9px 14px;min-width:96px;cursor:pointer;text-align:left;color:#fff}
.kpi b{display:block;font-size:22px;line-height:1.1;font-weight:800}
.kpi span{font-size:12.5px;opacity:.85}
.qc{background:#fff;color:var(--ink);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.qc-t{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.qc-t .serif{color:var(--blue);font-size:13px;letter-spacing:.05em}
.qc input{width:100%;margin-top:10px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.qc input:focus{border-color:var(--blue)}
.qr{margin-top:10px;border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.45;display:none}
.qr.show{display:block}
.qr.ok{background:#E9F8EF;color:#0B6B3A}
.qr.bad{background:#FDECEC;color:#A11D1D}
.qr.warn{background:#FFF6DB;color:#7A5300}
.qr b{font-weight:800}
.qr .act{margin-top:8px}

/* main */
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 120px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;color:#333}
.chip b{font-weight:800}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip.fu{border-color:#F3C64B;background:#FFF8E1}
.chip.fu.on{background:#7A5300;border-color:#7A5300;color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px 11px 38px;font-size:15px;outline:none}
.search input:focus{border-color:var(--blue)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
select.inp,.inp{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;outline:none}
.inp:focus{border-color:var(--blue)}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 15px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:#C9CDD8}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#111}
.btn.danger{color:#B42318;border-color:#F3C2BE}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.selbar{position:sticky;top:118px;z-index:20;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.selbar .btn{border-color:#333;background:#222;color:#fff}
.selbar .btn.yellow{background:var(--yellow);color:#111;border-color:var(--yellow)}
.selbar select{background:#222;color:#fff;border:1px solid #444;border-radius:10px;padding:7px 10px}
.selbar .note{font-size:12.5px;opacity:.75}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{font-size:13px;color:var(--sub);text-align:left;font-weight:700;padding:11px 12px;background:#FAFBFD;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid #F0F1F5;vertical-align:middle;font-size:15px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#F7F8FF}
.tbl tr.sel td{background:#EEF1FF}
.acc{display:flex;align-items:center;gap:10px;min-width:0}
.acc .h{font-weight:800;font-size:15.5px;word-break:break-all}
.acc .nm{font-size:13px;color:var(--sub)}
.pf{flex:none;width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff}
.pf.ig{background:linear-gradient(135deg,#F58529,#DD2A7B 55%,#8134AF)}
.pf.yt{background:#FF0000}.pf.tt{background:#111}.pf.bl{background:#03C75A}.pf.et{background:#8A90A0}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.st-발굴{background:#EEF0F4;color:#475066}
.st-제안발송{background:#E8ECFF;color:#293BAC}
.st-응답{background:#F1E9FF;color:#6A2FD1}
.st-협의중{background:#FFF1DC;color:#9A5B00}
.st-확정{background:#E3F7EC;color:#08804A}
.st-보류{background:#F2F3F5;color:#7B8190}
.st-거절{background:#FDECEC;color:#B42318}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px;margin-left:4px}
.tag.fu{background:#FFF1C2;color:#7A5300}
.tag.new{background:#E3F7EC;color:#08804A}
.tag.recent{background:#E8ECFF;color:#293BAC}
.who{display:inline-flex;align-items:center;gap:7px;font-weight:700;white-space:nowrap}
.muted{color:var(--sub);font-size:13.5px}
.cb{width:20px;height:20px;accent-color:var(--blue);cursor:pointer}
.empty{background:#fff;border:1px dashed #CDD2DE;border-radius:var(--r);padding:44px 20px;text-align:center;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* cards (mobile) */
.cards{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.card.sel{border-color:var(--blue);background:#F5F7FF}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:13.5px;color:var(--sub)}
.card .meta b{color:var(--ink)}
.card .acts{grid-column:1/-1;display:flex;gap:8px}
.card .acts .btn{flex:1;justify-content:center}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:20px;width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{max-width:980px}
.mh{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.mh h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.mh .x{margin-left:auto;border:0;background:#F1F2F6;border-radius:10px;width:36px;height:36px;font-size:20px;line-height:1;flex:none}
.mb{padding:18px 22px;overflow:auto}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:5px}
.fld .inp,.fld textarea{width:100%}
.fld.full{grid-column:1/-1}
textarea.inp{resize:vertical;min-height:80px;line-height:1.6}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:14px}
.notice.lock{background:#FFF6DB;color:#6B4A00}
.notice.info{background:#EEF1FF;color:#1D2C8A}
.notice.bad{background:#FDECEC;color:#A11D1D}
.notice.ok{background:#E9F8EF;color:#0B6B3A}
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 22px}
.mtabs button{border:0;background:none;padding:12px 6px;margin-right:14px;font-weight:800;font-size:15px;color:var(--sub);border-bottom:3px solid transparent}
.mtabs button.on{color:var(--ink);border-color:var(--blue)}
.msg{width:100%;min-height:300px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.75;background:#FCFCFE}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--sub);font-weight:600}
.kv dd{margin:0;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.sum div{border-radius:12px;padding:12px;background:#F6F7FA;text-align:center}
.sum b{display:block;font-size:24px;font-weight:900}
.sum span{font-size:12.5px;color:var(--sub);font-weight:700}
.sum .g{background:#E9F8EF}.sum .g b{color:#08804A}
.sum .r{background:#FDECEC}.sum .r b{color:#B42318}
.sum .y{background:#FFF6DB}.sum .y b{color:#7A5300}
.mini{width:100%;border-collapse:collapse;font-size:13.5px}
.mini th,.mini td{border-bottom:1px solid #F0F1F5;padding:7px 8px;text-align:left}
.mini th{color:var(--sub);font-weight:700;background:#FAFBFD}
.tplvars{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tplvars code{background:#EEF1FF;color:var(--blue);border-radius:6px;padding:2px 7px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:700}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column}
.login .lhero{background:linear-gradient(120deg,#0B3E96,#1E5CC8);color:#fff;padding:56px 20px 90px;text-align:center}
.login .lhero h1{margin:14px 0 4px;font-size:28px;font-weight:800}
.login .lhero p{margin:0;opacity:.85}
.lbox{max-width:440px;width:calc(100% - 32px);margin:-60px auto 40px;background:#fff;border-radius:22px;padding:24px;box-shadow:0 20px 50px rgba(15,30,80,.18)}
.lbox h3{margin:0 0 12px;font-size:16px}
.who-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.who-pick button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:16px}
.who-pick button .av{width:42px;height:42px;font-size:16px}
.who-pick button.on{border-color:var(--blue);background:#F2F4FF}
.pin{width:100%;margin-top:16px;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:22px;letter-spacing:.4em;text-align:center;outline:none}
.pin:focus{border-color:var(--blue)}
.lbox .btn{width:100%;justify-content:center;margin-top:12px;padding:14px;font-size:16px}
.lerr{color:#B42318;font-weight:700;font-size:14px;margin-top:10px;min-height:20px}

.fab{display:none;position:fixed;right:18px;bottom:22px;z-index:40;width:60px;height:60px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:30px;box-shadow:0 10px 24px rgba(41,59,172,.45)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast div{background:#111;color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:88vw}
.toast div.bad{background:#B42318}
.qc-row{display:flex;gap:8px;margin-top:10px}
.qc-row input{margin-top:0;flex:1;min-width:0}
.qc-row .btn{padding:0 18px;font-size:16px}
.qc-paste{width:100%;margin-top:10px;justify-content:center;padding:13px;font-size:15.5px}
.qc-hint{font-size:12.5px;color:var(--sub);margin-top:8px}
.rc{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:95;width:min(560px,calc(100vw - 24px));border-radius:18px;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.28);animation:rcin .25s ease}
@keyframes rcin{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
.rc.ok{background:#fff;border:2px solid #16A34A}
.rc.bad{background:#DC2626;color:#fff}
.rc.busy{background:#111;color:#fff}
.rc h3{margin:0 0 4px;font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.rc .big{font-size:20px;font-weight:900;word-break:break-all}
.rc .ln{font-size:14.5px;margin-top:4px;line-height:1.5}
.rc.bad .ln{color:#FFE4E4}
.rc .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.rc.bad .btn{background:#fff;color:#B42318;border-color:#fff}
.rc .x{position:absolute;right:10px;top:10px;border:0;background:rgba(0,0,0,.08);width:30px;height:30px;border-radius:9px;font-size:18px;color:inherit}
.rc.bad .x{background:rgba(255,255,255,.2)}
.tbl tr.dup td{background:#FEF2F2}
.tbl tr.dup td:first-child{box-shadow:inset 4px 0 0 #DC2626}
.card.dup{border-color:#F87171;background:#FEF2F2}
.tag.dup{background:#DC2626;color:#fff}
.bio{background:#F6F7FA;border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-top:12px}
.bm{display:inline-block;background:var(--blue);color:#fff!important;text-decoration:none;font-weight:800;padding:12px 20px;border-radius:12px;font-size:16px;cursor:grab}
.switch{display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:600;font-size:14.5px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--blue)}
.stg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-weight:800;font-size:13.5px;color:#333}
.stg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.ana{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ana div{background:#F6F7FA;border-radius:12px;padding:9px 10px}
.ana span{display:block;font-size:12px;color:var(--sub);font-weight:700}
.ana b{font-size:16px;font-weight:900}
.pop{position:absolute;z-index:70;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.16);padding:10px;width:250px}
.pop .t{font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:6px}
.badge.click{cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(41,59,172,.25)}
.extok{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#0B6B3A;background:#E9F8EF;border-radius:999px;padding:3px 9px}
.extno{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#9A5B00;background:#FFF6DB;border-radius:999px;padding:3px 9px;cursor:pointer;border:0}
@media (max-width:860px){.ana{grid-template-columns:repeat(2,1fr)}}
.inst{display:flex;align-items:center;gap:10px;background:#111;color:#fff;padding:10px 14px;font-size:14px;font-weight:700}
.inst .btn{margin-left:auto;padding:8px 14px;font-size:14px}
.inst .x{background:none;border:0;color:#aaa;font-size:20px;padding:0 4px}
.preview-flag{background:#111;color:var(--yellow);text-align:center;font-size:12.5px;padding:5px;font-weight:700}
.menu{position:absolute;right:20px;top:62px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.14);padding:6px;z-index:50;min-width:210px}
.menu button,.menu a{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;font-weight:600;color:var(--ink);text-decoration:none;font-size:14.5px}
.menu button:hover,.menu a:hover{background:#F3F4F8}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:860px){
  .hero-in{grid-template-columns:1fr;padding:18px 16px 20px;gap:14px}
  .hero h1{font-size:21px}
  .wrap{padding:14px 14px 110px}
  .hd-in{padding:12px 14px 8px}
  .tabs{padding:2px 14px 10px}
  .logo{height:20px}
  .hd-sub{font-size:12.5px}
  .sync span{display:none}
  .tbl{display:none}
  .cards{display:block}
  .fab{display:block}
  .toolbar .hide-m{display:none}
  .toolbar .search{flex-basis:100%}
  .selbar{top:108px}
  .grid2{grid-template-columns:1fr}

<script>
/* ===== VERY LABEL 인플루언서 보드 공용 로직 (서버/미리보기 공용) ===== */
var VL = (function () {
  var FIELDS = ['id','platform','handle','key','name','url','followers','category','contact','owner','status','offer','hook','memo','createdAt','createdBy','updatedAt','updatedBy','lastContactAt','lastContactBy','contactCount','version','bio','dupHits','dupLast','following','posts','engRate','avgLikes','avgComments','lastPost','adCount','acctType','igCategory','extLink','tier','fit','analyzedAt'];
  var LABELS = ['ID','플랫폼','아이디','중복키(수정금지)','이름/닉네임','링크','팔로워','카테고리','연락처','담당자','상태','제안유형','개인화 한줄','메모','등록일시','등록자','수정일시','수정자','최근연락일시','최근연락자','연락횟수','버전','소개글','중복시도횟수','최근중복시도','팔로잉','게시물수','참여율(%)','평균좋아요','평균댓글','최근게시일','협찬글수','계정유형','인스타카테고리','외부링크','등급','적합도','분석일시'];
  var MEMBERS = ['유경웅','박하운','염찬웅'];
  var STATUSES = ['발굴','제안발송','응답','협의중','확정','보류','거절'];
  var PLATFORMS = ['인스타그램','유튜브','틱톡','블로그','기타'];
  var CATEGORIES = ['건강/웰니스','다이어트/운동','뷰티','육아/맘','푸드/요리','일상/라이프','기타'];
  var OFFERS = ['제품 협찬','유료 광고','공동구매','장기 앰배서더'];
  var EDITABLE = ['name','url','followers','category','contact','status','offer','hook','memo'];
  var ANA = ['following','posts','engRate','avgLikes','avgComments','lastPost','adCount','acctType','igCategory','extLink','tier','fit','analyzedAt'];
  var TAKEOVER_DAYS = 14;   // 등록 후 14일간 연락 없는 '발굴' 건은 다른 담당자가 가져올 수 있음
  var RESEND_HOURS = 24;    // 24시간 안에 같은 사람에게 다시 발송 표시하면 막음

  function str(v) { return v == null ? '' : String(v).trim(); }
  function uid() { return 'VL' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase(); }
  function copy(o) { var n = {}; for (var k in o) n[k] = o[k]; return n; }

  function toNum(v) {
    if (typeof v === 'number') return isFinite(v) ? Math.round(v) : '';
    var s = str(v).toLowerCase().replace(/,/g, '').replace(/\s/g, '');
    if (!s) return '';
    var m = s.match(/^([0-9]*\.?[0-9]+)(만|천|k|m|b|억)?/);
    if (!m) return '';
    var u = { '만': 1e4, '천': 1e3, 'k': 1e3, 'm': 1e6, 'b': 1e9, '억': 1e8 }[m[2]] || 1;
    return Math.round(parseFloat(m[1]) * u);
  }

  function detectPlatform(s) {
    s = str(s);
    for (var i = 0; i < PLATFORMS.length; i++) if (s === PLATFORMS[i]) return s;
    var l = s.toLowerCase();
    if (/insta|인스타|ig/.test(l)) return '인스타그램';
    if (/you|유튜/.test(l)) return '유튜브';
    if (/tik|틱톡/.test(l)) return '틱톡';
    if (/blog|블로그|naver|네이버/.test(l)) return '블로그';
    return '';
  }

  /* 링크나 아이디를 받아 플랫폼 + 아이디 + 중복키로 정규화 */
  function parseAccount(input, hint) {
    var raw = str(input);
    if (!raw) return null;
    var platform = detectPlatform(hint), handle = '', url = '';
    var low = raw.toLowerCase();
    var isUrl = /^https?:\/\//.test(low) || /^(www\.|m\.)?(instagram\.com|youtube\.com|tiktok\.com|blog\.naver\.com|m\.blog\.naver\.com)/.test(low);
    if (isUrl) {
      url = /^https?:\/\//.test(raw) ? raw : 'https://' + raw;
      var q = low.match(/blogid=([^&#]+)/);
      var u = low.replace(/^https?:\/\//, '').replace(/^(www\.|m\.)/, '');
      var parts = u.split(/[?#]/)[0].split('/').filter(function (x) { return x; });
      var host = parts[0] || '', p1 = parts[1] || '', p2 = parts[2] || '';
      if (host.indexOf('instagram.com') >= 0) { platform = '인스타그램'; handle = (p1 === 'p' || p1 === 'reel' || p1 === 'stories') ? (p1 === 'stories' ? p2 : '') : p1; }
      else if (host.indexOf('youtube.com') >= 0) { platform = '유튜브'; handle = (p1 === 'channel' || p1 === 'c' || p1 === 'user') ? p2 : p1; }
      else if (host.indexOf('tiktok.com') >= 0) { platform = '틱톡'; handle = p1; }
      else if (host.indexOf('naver.com') >= 0) { platform = '블로그'; handle = q ? q[1] : p1; if (handle === 'postview.naver' || handle === 'postview.nhn') handle = q ? q[1] : ''; }
      else { platform = platform || '기타'; handle = parts.join('/'); }
    } else {
      handle = low;
    }
    handle = handle.replace(/^@+/, '').replace(/\/+$/, '').replace(/\s+/g, '').trim();
    try { handle = decodeURIComponent(handle); } catch (e) {}
    if (!handle) return null;
    if (!platform) platform = '인스타그램';
    if (!url) url = buildUrl(platform, handle);
    return { platform: platform, handle: handle, key: platform + ':' + handle, url: url };
  }

  function buildUrl(platform, handle) {
    if (platform === '인스타그램') return 'https://www.instagram.com/' + handle + '/';
    if (platform === '유튜브') return /^uc[a-z0-9_-]{20,}$/.test(handle) ? 'https://www.youtube.com/channel/' + handle : 'https://www.youtube.com/@' + handle;
    if (platform === '틱톡') return 'https://www.tiktok.com/@' + handle;
    if (platform === '블로그') return 'https://blog.naver.com/' + handle;
    return '';
  }

  function normContact(c) {
    c = str(c).toLowerCase();
    if (!c) return '';
    var em = c.match(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/);
    if (em) return em[0];
    var d = c.replace(/[^0-9]/g, '');
    return d.length >= 9 ? d : '';
  }

  /* 중복 찾기: hard = 같은 플랫폼 같은 아이디(등록 불가), soft = 확인 필요 */
  function findDup(rows, parsed, contact, exceptId) {
    var hard = null, soft = [];
    var nc = normContact(contact);
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.id === exceptId) continue;
      if (parsed && r.key === parsed.key) { hard = r; break; }
    }
    if (!hard) {
      for (var j = 0; j < rows.length; j++) {
        var x = rows[j];
        if (x.id === exceptId) continue;
        if (parsed && x.handle === parsed.handle && x.platform !== parsed.platform) soft.push({ row: x, reason: '다른 플랫폼에 같은 아이디가 있어요' });
        else if (nc && normContact(x.contact) === nc) soft.push({ row: x, reason: '같은 연락처가 등록돼 있어요' });
      }
    }
    return { hard: hard, soft: soft };
  }

  function makeRow(obj, p, user, now) {
    var owner = MEMBERS.indexOf(str(obj.owner)) >= 0 ? str(obj.owner) : user;
    var cat = str(obj.category);
    var offer = str(obj.offer);
    var r0 = {
      id: uid(), platform: p.platform, handle: p.handle, key: p.key,
      name: str(obj.name), url: str(obj.url) && /^https?:/i.test(str(obj.url)) ? str(obj.url) : p.url,
      followers: toNum(obj.followers), category: cat, contact: str(obj.contact),
      owner: owner, status: STATUSES.indexOf(str(obj.status)) >= 0 ? str(obj.status) : '발굴',
      offer: offer || '제품 협찬', hook: str(obj.hook), memo: str(obj.memo),
      createdAt: now, createdBy: user, updatedAt: now, updatedBy: user,
      lastContactAt: '', lastContactBy: '', contactCount: 0, version: 1, bio: str(obj.bio).slice(0, 500), dupHits: 0, dupLast: '',
      following: '', posts: '', engRate: '', avgLikes: '', avgComments: '', lastPost: '', adCount: '', acctType: '', igCategory: '', extLink: '', tier: tierOf(toNum(obj.followers)), fit: '', analyzedAt: ''
    };
    ANA.forEach(function (f) { if (obj[f] !== undefined && obj[f] !== null && obj[f] !== '') r0[f] = obj[f]; });
    return r0;
  }

  function find(rows, id) { for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i]; return null; }
  function label(r) { return (r.platform === '블로그' ? 'blog/' : '@') + r.handle; }

  function add(rows, obj, user, now) {
    var p = parseAccount(obj.account || obj.url, obj.platform);
    if (!p) return { ok: false, error: '아이디 또는 프로필 링크를 입력해 주세요' };
    var d = findDup(rows, p, obj.contact);
    if (d.hard) {
      var ops0 = [];
      if (d.hard.owner !== user) { var hr = copy(d.hard); hr.dupHits = Number(hr.dupHits || 0) + 1; hr.dupLast = user + '|' + now; ops0.push({ t: 'update', row: hr }); }
      return { ok: false, dup: d.hard, ops: ops0, logs: [['중복시도', label(d.hard), d.hard.owner + ' 담당 계정을 ' + user + '님이 등록 시도']], error: '이미 등록된 인플루언서예요 (' + d.hard.owner + ' 담당 · ' + d.hard.status + ')' };
    }
    if (d.soft.length && !obj.force) return { ok: false, needConfirm: true, soft: d.soft, error: '비슷한 항목이 있어요. 확인 후 다시 등록해 주세요' };
    if (!obj.url) obj.url = p.url;
    var row = makeRow(obj, p, user, now);
    return { ok: true, row: row, ops: [{ t: 'append', row: row }], logs: [['등록', label(row), row.owner + ' 담당']] };
  }

  function bulk(rows, list, user, now, owner) {
    var work = rows.slice(), added = [], dups = [], inFile = [], invalid = [], soft = [], seen = {};
    for (var i = 0; i < list.length; i++) {
      var obj = list[i] || {};
      if (owner && !str(obj.owner)) obj.owner = owner;
      var p = parseAccount(obj.account || obj.url, obj.platform);
      if (!p) { invalid.push({ line: obj._line || i + 1, input: str(obj.account || obj.url) }); continue; }
      if (seen[p.key]) { inFile.push({ line: obj._line || i + 1, input: label(p), first: seen[p.key] }); continue; }
      var d = findDup(work, p, obj.contact);
      if (d.hard) { dups.push({ line: obj._line || i + 1, input: label(p), owner: d.hard.owner, status: d.hard.status, mine: d.hard.owner === user }); seen[p.key] = obj._line || i + 1; continue; }
      if (!obj.url) obj.url = p.url;
      var row = makeRow(obj, p, user, now);
      if (d.soft.length) soft.push({ line: obj._line || i + 1, input: label(p), reason: d.soft[0].reason, other: label(d.soft[0].row), owner: d.soft[0].row.owner });
      seen[p.key] = obj._line || i + 1;
      work.push(row); added.push(row);
    }
    var ops = added.length ? [{ t: 'appendMany', rows: added }] : [];
    return { ok: true, added: added, dups: dups, inFile: inFile, invalid: invalid, soft: soft, ops: ops,
      logs: added.length ? [['일괄등록', added.length + '명', '중복 ' + dups.length + ' / 파일내중복 ' + inFile.length]] : [] };
  }

  /* ---- 인스타그램 공개 프로필 정보 파싱 ---- */
  function decodeEnt(s) {
    return String(s || '').replace(/&#x([0-9a-f]+);/gi, function (m, h) { try { return String.fromCodePoint(parseInt(h, 16)); } catch (e) { return ''; } })
      .replace(/&#(\d+);/g, function (m, d) { try { return String.fromCodePoint(Number(d)); } catch (e) { return ''; } })
      .replace(/&quot;/g, '"').replace(/&#039;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  }
  var CAT_KW = [
    ['육아/맘', /육아|맘스|엄마|아들맘|딸맘|육아스타|아기|키즈|임산부|출산|\bmom\b|mama|baby/i],
    ['다이어트/운동', /다이어트|운동|헬스|필라테스|요가|러닝|마라톤|바디프로필|크로스핏|fitness|gym|workout|pilates|yoga/i],
    ['뷰티', /뷰티|메이크업|화장품|스킨케어|코덕|beauty|makeup|skincare/i],
    ['푸드/요리', /요리|레시피|집밥|맛집|먹스타|베이킹|도시락|food|cook|recipe|baking/i],
    ['건강/웰니스', /건강|웰니스|영양|비건|약사|영양사|한의|자연식|wellness|health|vegan/i],
    ['일상/라이프', /일상|데일리|daily|라이프|lifestyle|여행|travel|패션|fashion|ootd/i]
  ];
  function guessCategory(text) { text = str(text); for (var i = 0; i < CAT_KW.length; i++) if (CAT_KW[i][1].test(text)) return CAT_KW[i][0]; return ''; }
  function parseIgDesc(desc, handle) {
    desc = decodeEnt(desc).replace(/\s+/g, ' ').trim();
    var out = { ok: false };
    var m = desc.match(/^([\d.,]+\s*[KMB]?)\s+Followers?,\s*([\d.,]+\s*[KMB]?)\s+Following,\s*([\d.,]+\s*[KMB]?)\s+Posts?\s*-\s*(?:See Instagram photos and videos from\s*)?(.*?)\s*\(@([^)]+)\)(?:\s*on Instagram:\s*["']([\s\S]*)["']\s*$)?/i);
    var k = !m && desc.match(/팔로워\s*([\d.,]+\s*[만천억KMB]?)\s*명?,?\s*팔로잉\s*([\d.,]+\s*[만천KMB]?)\s*명?,?\s*게시물\s*([\d.,]+\s*[만천KMB]?)\s*개?\s*-\s*(.*?)\s*\(@([^)]+)\)(?:[^"']*["']([\s\S]*)["']\s*$)?/);
    var r = m || k;
    if (!r) return out;
    if (handle && r[5].toLowerCase() !== String(handle).toLowerCase()) return out;
    var bio = str(r[6]);
    var em = bio.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
    return { ok: true, followers: toNum(r[1]), following: toNum(r[2]), posts: toNum(r[3]), name: str(r[4]), handle: r[5].toLowerCase(), bio: bio, email: em ? em[0] : '', category: guessCategory(bio + ' ' + r[4]) };
  }
  function parseIgHtml(html, handle) {
    html = String(html || '');
    var d = (html.match(/<meta content="([^"]*)" name="description"/) || html.match(/<meta name="description" content="([^"]*)"/) || [])[1];
    var res = parseIgDesc(d || '', handle);
    if (!res.ok) { var og = (html.match(/property="og:description" content="([^"]*)"/) || [])[1]; res = parseIgDesc(og || '', handle); }
    return res;
  }
  /* 인스타 프로필 화면 상단 글자에서 정보 읽기 (PC 연동 버튼용) */
  function parseIgHeader(text, handle, exact) {
    text = String(text || '');
    var f = text.match(/팔로워\s*([\d.,]+\s*[만천억KMB]?)/i) || text.match(/([\d.,]+\s*[KMB만천]?)\s*(?:followers|팔로워)/i);
    var fol = exact ? toNum(String(exact).replace(/,/g, '')) : (f ? toNum(f[1]) : '');
    if (fol === '') return { ok: false };
    var lines = text.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
    var idx = -1;
    for (var i = 0; i < lines.length; i++) if (/팔로우\s*[\d.,]|[\d.,]+\s*(following|팔로우)|following\s*[\d.,]/i.test(lines[i])) idx = i;
    var skip = /^(팔로우|팔로잉|메시지|게시물|팔로워|follow|following|message|posts?|followers|더 보기|more|번역 보기|see translation|옵션|연락처|contact|email|이메일|[\d.,]+\s*[만천KMB]?)$/i;
    var rest = lines.slice(idx + 1).filter(function (l) { return !skip.test(l) && l.toLowerCase() !== String(handle || '').toLowerCase(); });
    var name = rest[0] || '', bio = rest.slice(1, 8).join(' ').slice(0, 500);
    var em = (bio + ' ' + text).match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
    return { ok: true, followers: fol, name: name.slice(0, 60), bio: bio, email: em ? em[0] : '', category: guessCategory(bio + ' ' + name) };
  }
  function tierOf(n) { n = Number(n); if (!n) return ''; if (n >= 1e6) return '메가'; if (n >= 1e5) return '매크로'; if (n >= 1e4) return '마이크로'; return '나노'; }
  var FIT_KW = /건강|웰니스|다이어트|운동|필라테스|요가|러닝|육아|아이|엄마|아침|루틴|식단|영양|유기농|비건|주스|착즙|홈카페|클린|자연|면역|피로|눈건강|베리|빌베리|과일|식품|레시피|살림/g;
  var AD_KW = /#?(유료광고|광고|협찬|제품제공|원고료|소정의|sponsored|paidpartnership|\bad\b|공구|공동구매)/i;
  /* 인스타 원본 데이터(확장 프로그램이 가져온 것)를 분석해 DB 항목으로 변환 */
  function analyzeIg(raw) {
    if (!raw) return { ok: false };
    var now = new Date().toISOString();
    if (raw.kind === 'meta') {
      var m = parseIgDesc(raw.desc || '', raw.handle);
      if (!m.ok) return { ok: false, reason: raw.notFound ? 'notfound' : 'nodata' };
      var fitN0 = ((m.bio + ' ' + m.name).match(FIT_KW) || []).length;
      return { ok: true, source: 'meta', followers: m.followers, following: m.following, posts: m.posts, name: m.name, bio: m.bio, email: m.email, category: m.category, tier: tierOf(m.followers), fit: fitN0 >= 3 ? '높음' : fitN0 >= 1 ? '보통' : '낮음', analyzedAt: now };
    }
    if (raw.kind !== 'api' || !raw.user) return { ok: false, reason: raw.notFound ? 'notfound' : (raw.limited ? 'limited' : 'nodata') };
    var u = raw.user, items = u.items || [];
    var fol = Number(u.followers) || 0;
    var likes = items.map(function (x) { return Number(x.likes) || 0; }), coms = items.map(function (x) { return Number(x.comments) || 0; });
    var sum = function (a) { return a.reduce(function (s, v) { return s + v; }, 0); };
    var avgL = items.length ? Math.round(sum(likes) / items.length) : '', avgC = items.length ? Math.round(sum(coms) / items.length) : '';
    var eng = (items.length && fol) ? Math.round((avgL + avgC) / fol * 10000) / 100 : '';
    var ts = items.map(function (x) { return Number(x.ts) || 0; }).filter(function (v) { return v; }).sort(function (a, b) { return b - a; });

function parseTable(rows) {
  rows = rows.filter(function (r) { return r.some(function (c) { return String(c || '').trim(); }); });
  if (!rows.length) return [];
  var head = rows[0].map(function (c) { return String(c || '').trim(); }), map = {}, hasHead = false;
  head.forEach(function (h, i) { for (var k = 0; k < HEAD_MAP.length; k++) if (HEAD_MAP[k][1].test(h) && map[HEAD_MAP[k][0]] == null) { map[HEAD_MAP[k][0]] = i; hasHead = true; break; } });
  if (!hasHead || map.account == null) map = { account: 0, name: 1, followers: 2, category: 3, contact: 4, memo: 5 };
  var body = hasHead && map.account != null ? rows.slice(1) : rows;
  return body.map(function (r, i) {
    var o = { _line: i + (hasHead ? 2 : 1) };
    Object.keys(map).forEach(function (k) { var v = r[map[k]]; o[k] = v == null ? '' : (typeof v === 'object' && v.text ? v.text : (typeof v === 'object' && v.hyperlink ? v.hyperlink : String(v).trim())); });
    if (o.owner && VL.MEMBERS.indexOf(o.owner) < 0) o.owner = '';

    return o;
  });
}
function parseCSV(text) {
  var sep = text.indexOf('\t') >= 0 ? '\t' : ',', out = [], row = [], cur = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  return out;
}

  var body = '<div class="notice info">여기서 바꾼 내용은 팀 전체에 같이 적용돼요. 성과 보장 수치(매출, 효과)는 근거 없이 넣지 마세요.</div>' +
    '<h4 style="margin:4px 0 8px">담당자 연락처 (멘트 끝에 들어가요)</h4><div class="grid2" style="grid-template-columns:repeat(3,1fr)">' + VL.MEMBERS.map(function (m) { return '<div class="fld"><label>' + m + '</label><input class="inp" data-ct="' + m + '" value="' + esc(st.contacts[m] || '') + '" placeholder="예: 010-0000-0000 / 메일"></div>'; }).join('') + '</div>' +
    '<div class="grid2" style="margin-top:12px"><div class="fld full"><label>브랜드 소개 {브랜드소개}</label><textarea class="inp" id="sBrand" rows="2">' + esc(st.brand) + '</textarea></div>' +
    '<div class="fld"><label>제품 {제품}</label><input class="inp" id="sProd" value="' + esc(st.product) + '"></div><div class="fld"><label>제공 내역 {제공내역}</label><input class="inp" id="sGift" value="' + esc(st.gift) + '"></div></div>' +
    '<h4 style="margin:18px 0 8px">멘트 템플릿</h4><div class="seg" id="sTabs"></div>' +
    '<div class="fld" style="margin-top:10px"><label>템플릿 이름</label><input class="inp" id="sName" style="width:100%"></div>' +
    '<div class="fld" style="margin-top:10px"><label>내용 (아래 변수를 누르면 커서 위치에 들어가요)</label><div class="tplvars">' + VARS.map(function (v) { return '<code data-v="' + v + '">{' + v + '}</code>'; }).join('') + '</div><textarea class="inp" id="sBody" rows="12" style="width:100%"></textarea></div>';
  openModal('멘트 설정', body, '<button class="btn" id="sReset">기본값으로</button><span style="flex:1"></span><button class="btn" data-close>취소</button><button class="btn primary" id="sSave">팀 전체에 저장</button>', { wide: true });
  var drawTabs = function () {
    $('#sTabs').innerHTML = tpls.map(function (t, i) { return '<button data-i="' + i + '"' + (i === cur ? ' class="on"' : '') + '>' + esc(t.name) + '</button>'; }).join('') + '<button data-i="new">+ 새 템플릿</button>';
    $$('#sTabs button').forEach(function (b) { b.onclick = function () { keep(); if (b.dataset.i === 'new') { tpls.push({ id: 't' + Date.now().toString(36), name: '새 템플릿', body: '안녕하세요 {이름}님, 베리라벨 {담당자}입니다.\n' }); cur = tpls.length - 1; } else cur = Number(b.dataset.i); drawTabs(); load(); }; });
  };
  var load = function () { $('#sName').value = tpls[cur].name; $('#sBody').value = tpls[cur].body; };
  var keep = function () { tpls[cur].name = $('#sName').value.trim() || '템플릿'; tpls[cur].body = $('#sBody').value; };
  drawTabs(); load();
  $$('.tplvars code').forEach(function (c) { c.onclick = function () { var ta = $('#sBody'), s = ta.selectionStart, e = ta.selectionEnd, v = '{' + c.dataset.v + '}'; ta.value = ta.value.slice(0, s) + v + ta.value.slice(e); ta.focus(); ta.selectionStart = ta.selectionEnd = s + v.length; }; });
  $('#sReset').onclick = function () { if (!confirm('템플릿을 기본값으로 되돌릴까요? (저장 전까지 반영 안 됨)')) return; tpls = JSON.parse(JSON.stringify(DEFAULT_SETTINGS.templates)); cur = 0; drawTabs(); load(); };
  $('#sSave').onclick = function () {
    keep();
    var contacts = {}; $$('[data-ct]').forEach(function (i) { contacts[i.dataset.ct] = i.value.trim(); });
    var payload = { contacts: contacts, brand: $('#sBrand').value.trim(), product: $('#sProd').value.trim(), gift: $('#sGift').value.trim(), templates: tpls };
    var btn = this; btn.disabled = true;
    call('saveSettings', payload).then(function () { S.settings = Object.assign({}, S.settings, payload); toast('팀 전체에 저장했어요'); closeModal(); }).catch(function (e) { btn.disabled = false; toast(e.message, true); });
  };
}

/* ---------- 시작 ---------- */
(function boot() {
  window.postMessage({ type: 'VL_PING' }, '*');
  takeIncoming();
  window.addEventListener('focus', function () { setTimeout(checkClipboard, 300); });
  window.addEventListener('hashchange', function () { takeIncoming(); runPending(); });
  if (API_URL && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  S.token = localStorage.getItem('vl_token');
  if (S.token) {
    S.me = IS_LIVE ? null : S.token.replace('preview-', '');
    call('list').then(function (d) { S.me = d.me; S.rows = d.rows; S.settings = d.settings || {}; S.sheetUrl = d.sheetUrl || ''; S.loaded = true; S.lastSync = Date.now(); S.tab = d.me; renderShell(); renderAll(); runPending(); sendAuthToExt(); setTimeout(enrichQueue, 2000); setTimeout(checkClipboard, 800); })
      .catch(function () { renderLogin(); });
  } else renderLogin();
  setInterval(function () { if (S.token && S.me && document.visibilityState === 'visible' && !$('#modal').innerHTML) sync(); else renderSync(); }, 20000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.token && S.me) sync(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
})();
</script>
</body>
</html>
